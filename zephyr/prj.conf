# LED
CONFIG_GPIO=y

# IMU (LSM6DS3TR-C, Zephyr-Treiber "lsm6dsl") am I2C-Bus
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_REGULATOR=y

# Fließkomma rechnen und mit printk ausgeben
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Bluetooth Low Energy: Peripheral mit eigenem GATT-Service
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="XIAO-IMU"
CONFIG_BT_MAX_CONN=1
# größere Pakete (bis 244 Byte Nutzdaten), damit mehrere Messungen in eine Notification passen
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

CONFIG_MAIN_STACK_SIZE=2048
